pre-commit:
  commands:
    biome-check:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx biome check --write --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
